{% extends 'gestion_escolar/base.html' %}

{% block content %}
<div class="comp-page-container">
    <div class="comp-form-narrow">
        <div class="comp-page-header">
            <div class="comp-title-group">
                <h1 class="comp-title">Eliminar Rol</h1>
                <p class="comp-subtitle">Esta acción no se puede deshacer.</p>
            </div>
        </div>

        <div class="comp-panel">
            <div class="comp-panel-body">
                <p>¿Estás seguro de que deseas eliminar el rol <strong>{{ role.name }}</strong>?</p>
                <div class="comp-alert comp-alert-danger">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div>Los usuarios que pertenezcan a este rol perderán todos los permisos asociados a él.</div>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="comp-form-actions">
                        <a href="{% url 'role_list' %}" class="comp-btn comp-btn-ghost">Cancelar</a>
                        <button type="submit" class="comp-btn comp-btn-danger">Sí, eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
