{% extends 'gestion_escolar/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card apple-panel border-0">
                <div class="card-body p-4">
                    <h4 class="mb-3" style="font-weight: 700; letter-spacing: -0.01em;">Eliminar Escuela</h4>
                    <p>¿Eliminar la escuela <strong>{{ escuela.nombre_ct }}</strong> (CCT: {{ escuela.id_escuela }})?</p>
                    <p style="color: var(--heat, #ff6b00);">Esta acción no se puede deshacer.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'lista_escuelas' %}" class="apple-btn-ghost">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Eliminar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
