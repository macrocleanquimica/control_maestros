{% extends 'gestion_escolar/base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card apple-panel border-0">
                <div class="card-body p-4">
                    <h4 class="apple-title mb-3" style="font-size: clamp(20px, 2.5vw, 24px);">Restablecer Contraseña</h4>
                    <p class="text-muted mb-4">Introduce tu dirección de correo electrónico a continuación y te enviaremos instrucciones para establecer una nueva.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                            <a href="{% url 'ajustes' %}" class="apple-btn-ghost">Cancelar</a>
                            <button type="submit" class="apple-btn">Enviar instrucciones</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
