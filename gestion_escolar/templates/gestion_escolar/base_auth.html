<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Acceso | Sistema de Control de Maestros{% endblock %}</title>
    {% load static %}
    <!-- CSS -->
    <link href="{% static 'gestion_escolar/css/vendor/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'gestion_escolar/css/apple-tokens.css' %}">
    {% if active_theme and active_theme.color_boton %}
    <style>
        :root {
            --accent: {{ active_theme.color_boton }};
            --accent-link: {{ active_theme.color_boton }};
        }
    </style>
    {% endif %}

    <style>
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .main-content {
            width: 100%;
            max-width: 480px;
            animation: authFadeIn 0.4s ease-out;
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Botón primario del sistema */
        .btn-auth-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--r-pill);
            padding: 0 22px;
            min-height: 44px;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-auth-primary:hover {
            color: #fff;
            opacity: 0.92;
        }

        .form-label-auth {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 0.5rem;
        }

        .form-control-auth {
            background: #fff;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control-auth:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
            outline: none;
        }

        a.inline-link {
            color: var(--accent-link);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="{% static 'gestion_escolar/js/vendor/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}
    {% endblock %}
</body>
</html>
